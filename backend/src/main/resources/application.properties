# [AI assisted chat-003]
# 使用 AI 協助設定 PostgreSQL 資料庫連線
# 與 Hibernate ORM 相關參數
spring.application.name=cardfolio-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/cardfolio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.swagger-ui.path=/swagger-ui.html
cardfolio.frontend-base-url=${CARDFOLIO_FRONTEND_BASE_URL:}

