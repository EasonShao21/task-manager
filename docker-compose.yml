# [AI assisted chat-006]
# 使用 AI 協助建立 Docker Compose 設定
# 整合 PostgreSQL、Backend 與 Frontend 容器

services:
  postgres:
    image: postgres:16
    container_name: task-manager-db

    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: